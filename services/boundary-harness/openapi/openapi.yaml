openapi: 3.1.0
info:
  title: Boundary Harness Domain API M0
  version: "0.1.0"
  description: |
    M0 Domain API. DB is system of record.
    Security: Authorization Bearer JWT claims sub,role,pool_ids,iat,exp (optional tid).
    Compatibility alias: role or role:actor, plus X-Harness-Role / X-Harness-Actor.
    Roles: decision_maker|coordinator|executor|viewer|service.
    Insufficient role → 403. Cross pool_ids → 403 pool_forbidden.
    Pool.secret_ref is file: or env: only; API never echoes resolved plaintext.
    policy/check returns decision, track, reason_code, redirect.
    Admin freeze POST/GET /v1/admin/freeze; new dispatch → 423 freeze_active.
    Goal dial freeze remains 403 dial_frozen and is distinct from admin freeze.
    audit_log is append-only (nine columns; no PATCH/DELETE).
    M4 glove scope: only bots participating in a Boundary Goal (not the whole account).
    Bot completion writes (POST /v1/assignments/{id}/dispatch, POST /v1/runs/{id}/evidence)
    require header x-harness-entry: mcp (injected by the MCP proxy). Direct Cursor /
    cursor_raw_* is never a completion path. No Bearer and no x-harness-role → 401 unauthenticated.
    Missing entry → 403 mcp_entry_required. decide_gate remains decision_maker only (executor → 403).
    attach_evidence success does not imply Gate ready — Ready still uses appendix A predicates.
    Decision-maker office shell (/v1/office/*) is a READ projection plus limited goal create
    (title + one-sentence intent). Owner/dispatch write paths on these routes return 403.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness and schema version
      responses:
        "200":
          description: OK
  /hooks/github:
    post:
      security: []
      summary: Inbound GitHub hook (HMAC-SHA256 required)
      description: |
        Fail-closed HMAC-SHA256. Headers:
        X-Harness-Signature: sha256=<hex>
        X-Harness-Timestamp: <unix_seconds>
        Payload `{timestamp}.{raw_body}`. Skew ±300s → 401 webhook_skew.
        Bad/missing signature or secret → 401 webhook_bad_signature.
        Secret is WEBHOOK_SIGNING_SECRET (never logged).
        Ready snapshots are M2; accepted events must go through outbox.
      parameters:
        - $ref: "#/components/parameters/HarnessSignature"
        - $ref: "#/components/parameters/HarnessTimestamp"
      responses:
        "202":
          description: accepted → outbox / snapshot refresh
        "401":
          description: webhook_bad_signature | webhook_skew
  /v1/hooks/github:
    post:
      security: []
      summary: Inbound GitHub webhook (M2 Ready input; M0 stub may 501)
      parameters:
        - $ref: "#/components/parameters/HarnessSignature"
        - $ref: "#/components/parameters/HarnessTimestamp"
      responses:
        "202":
          description: accepted → outbox / snapshot refresh
        "401":
          description: webhook_bad_signature | webhook_skew
  /hooks/cursor:
    post:
      security: []
      summary: Inbound Cursor hook (HMAC-SHA256 required)
      parameters:
        - $ref: "#/components/parameters/HarnessSignature"
        - $ref: "#/components/parameters/HarnessTimestamp"
      responses:
        "202":
          description: accepted
        "401":
          description: webhook_bad_signature | webhook_skew
  /v1/hooks/cursor:
    post:
      security: []
      summary: Optional Cursor hook; same HMAC rules
      parameters:
        - $ref: "#/components/parameters/HarnessSignature"
        - $ref: "#/components/parameters/HarnessTimestamp"
      responses:
        "202":
          description: accepted
        "401":
          description: webhook_bad_signature | webhook_skew
  /v1/events/stream:
    get:
      summary: SSE gate.ready / run.failed / budget.exceeded / freeze.changed
      responses:
        "200":
          description: text/event-stream
  /v1/admin/freeze:
    get:
      summary: Read admin freeze (decision_maker or service)
      responses:
        "200":
          description: Freeze state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezeState"
        "401":
          description: unauthorized
        "403":
          description: forbidden
    post:
      summary: Set admin freeze (decision_maker or service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezeSetRequest"
      responses:
        "200":
          description: Updated freeze state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezeState"
        "401":
          description: unauthorized
        "403":
          description: forbidden
        "422":
          description: freeze_invalid
  /v1/audit:
    get:
      summary: List audit_log (append-only nine columns)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
        "403":
          description: forbidden
    patch:
      summary: Forbidden — audit_log is append-only
      responses:
        "405":
          description: Method not allowed
    delete:
      summary: Forbidden — audit_log is append-only
      responses:
        "405":
          description: Method not allowed
  /v1/pools:
    post:
      summary: Create pool (decision_maker|service). secret_ref file:|env: only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, secret_ref]
              properties:
                id: { type: string }
                kind: { type: string, enum: [cursor_account, bot_group, noop] }
                secret_ref: { $ref: "#/components/schemas/SecretRef" }
      responses:
        "201":
          description: Created (secret_ref URI only)
        "400":
          description: secret_ref_unsupported
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      summary: List execution pools (secret_ref URI returned; plaintext never echoed)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools:
                    type: array
                    items:
                      $ref: "#/components/schemas/PoolPublic"
        "401":
          description: unauthorized
        "403":
          description: forbidden
  /v1/office/goals:
    get:
      summary: Office goal list (human titles + one-sentence status)
      description: |
        Decision-maker shell READ projection. `title` is a human label — never a raw UUID.
        Does not expose assignment-board or dispatch controls.
      responses:
        "200":
          description: Human-readable goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeGoalList"
        "401":
          description: unauthorized
        "403":
          description: forbidden
    post:
      summary: Create a Goal from the office shell (title + intent)
      description: |
        Limited create for the decision-maker shell. Body is title (name) + one-sentence intent.
        BriefV1 forbidden keys (steps, script, playbook, …) → 422 brief_forbidden_field.
        Does not assign, dispatch, or start a run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfficeGoal"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeGoal"
        "403":
          description: forbidden
        "422":
          description: brief_forbidden_field | goal_title_required | goal_intent_required
  /v1/office/goals/{id}/fill_slots:
    get:
      summary: Fill-slot projection (who is filling, stage, artifact links)
      description: |
        READ only. Projects who is filling, progress stage, and artifact entry links.
        Not an assignment board — no assign / drag / start-run fields.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Fill slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeFillSlots"
        "403":
          description: forbidden
        "404":
          description: not_found
    post:
      summary: Forbidden — office fill slots are read-only
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "403":
          description: office_write_forbidden
  /v1/office/desks/presence:
    get:
      summary: Desk presence (busy | waiting_evidence | idle)
      description: |
        READ only three states. No write owner, no dispatch from this endpoint.
        Mirrors GET /v1/desks.
      responses:
        "200":
          description: Presence roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskPresenceList"
        "403":
          description: forbidden
    post:
      summary: Forbidden — office desks are read-only
      responses:
        "403":
          description: office_write_forbidden
    patch:
      summary: Forbidden — office desks are read-only
      responses:
        "403":
          description: office_write_forbidden
  /v1/office/desks/{id}/assign:
    post:
      summary: Forbidden — no owner write from the office shell
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "403":
          description: office_write_forbidden
  /v1/office/goals/{id}/dispatch:
    post:
      summary: Forbidden — no dispatch from the office shell
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "403":
          description: office_write_forbidden
  /v1/goals:
    post:
      summary: Create Goal (coordinator_ref required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoal"
      responses:
        "201":
          description: Created
        "403":
          description: RBAC
        "422":
          description: coordinator_ref_required or mode_template_mismatch or plaintext_credential_forbidden
  /v1/goals/{id}:
    get:
      summary: Get Goal plus GateDefs
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
        "403":
          description: forbidden
  /v1/goals/{id}/dial:
    post:
      summary: Set Goal dial (M0 provisional until Freeze API is frozen)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dial]
              additionalProperties: false
              properties:
                dial:
                  $ref: "#/components/schemas/Dial"
      responses:
        "200":
          description: Updated
        "403":
          description: forbidden
        "422":
          description: dial_invalid
  /v1/goals/{id}/assignments:
    post:
      summary: Fill Assignment (BriefV1). budget → budget_json.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillAssignment"
      responses:
        "201":
          description: Created
        "400":
          description: predicate_evidence_mismatch
        "403":
          description: RBAC / human fan-out without exception
        "422":
          description: brief_forbidden_field
  /v1/goals/{id}/exception-grants:
    post:
      summary: Decision-maker scoped human fan-out grant
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Created
        "403":
          description: forbidden
  /v1/assignments/{id}:
    get:
      summary: Get Assignment
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
  /v1/assignments/{id}/dispatch:
    post:
      summary: Create Run; Idempotency-Key; blocked when freeze_active
      description: |
        Bot completion write. Requires `x-harness-entry: mcp` (MCP proxy injects it).
        M4 glove applies only to bots on a Boundary Goal. Direct Domain POST without
        entry → 403 mcp_entry_required. No Bearer and no role session → 401 unauthenticated.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/HarnessEntry"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key:
                  type: string
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "200":
          description: Idempotent replay
        "401":
          description: unauthenticated
        "403":
          description: forbidden | mcp_entry_required | pool_forbidden
        "423":
          description: freeze_active — reject new dispatch (incl MCP)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example: { code: freeze_active, message: "Freeze enabled; new dispatch rejected" }
  /v1/runs/{id}:
    get:
      summary: Get Run (advisory; MUST NOT be used as Gate ready)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
  /v1/runs/{id}/evidence:
    post:
      summary: Unique completion entry. shadow=true is Path B and cannot write Gate.
      description: |
        Bot completion write. Requires `x-harness-entry: mcp`.
        attach_evidence 2xx ≠ Gate ready. Ready still uses appendix A predicates.
        Direct POST without entry → 403 mcp_entry_required. No auth → 401 unauthenticated.
        M4 glove scope: only bots participating in a Boundary Goal.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/HarnessEntry"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachEvidence"
      responses:
        "201":
          description: Created
        "401":
          description: unauthenticated
        "403":
          description: forbidden | mcp_entry_required
  /v1/policy/check:
    post:
      summary: Policy/Dial check. Authority whitelist is exactly five keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCheck"
      responses:
        "200":
          description: decision + track + reason_code + redirect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCheckResult"
        "403":
          description: forbidden
  /v1/gates:
    get:
      summary: List GateInstances (Inbox uses status=ready)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, ready, decided, cancelled]
        - in: query
          name: goal_id
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403":
          description: forbidden
  /v1/gates/{id}/decide:
    post:
      summary: Decide a ready GateInstance (decision_maker, optimistic lock)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideGate"
      responses:
        "200":
          description: Decided
        "403":
          description: only decision_maker
        "409":
          description: gate_version_conflict
  /v1/policy-events:
    patch:
      summary: Forbidden — policy_events are append-only
      responses:
        "405":
          description: Method not allowed
    delete:
      summary: Forbidden — policy_events are append-only
      responses:
        "405":
          description: Method not allowed
  /v1/gate-decisions:
    patch:
      summary: Forbidden — gate_decisions are append-only
      responses:
        "405":
          description: Method not allowed
    delete:
      summary: Forbidden — gate_decisions are append-only
      responses:
        "405":
          description: Method not allowed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT claims MUST include: sub, role, pool_ids[], iat, exp.
        Optional: tid. Cross-pool → 403 pool_forbidden.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    HarnessSignature:
      name: X-Harness-Signature
      in: header
      required: true
      schema:
        type: string
        pattern: "^sha256=[0-9a-f]+$"
      description: HMAC-SHA256 over `{timestamp}.{raw_body}`; secret WEBHOOK_SIGNING_SECRET
    HarnessTimestamp:
      name: X-Harness-Timestamp
      in: header
      required: true
      schema:
        type: integer
      description: unix seconds; skew ±300s else 401 webhook_skew
    HarnessEntry:
      name: X-Harness-Entry
      in: header
      required: true
      schema:
        type: string
        enum: [mcp]
      description: |
        MCP proxy injects `mcp` on bot completion writes (dispatch, attach_evidence).
        Browser / Bot direct Domain calls omit it and are rejected with 403 mcp_entry_required.
  responses:
    Forbidden:
      description: RBAC / pool_forbidden / human fan-out without exception
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    Dial:
      type: string
      enum: [free, guided, gated, freeze]
    Role:
      type: string
      enum: [decision_maker, coordinator, executor, viewer, service]
    DialAuthorityAction:
      type: string
      enum:
        - external_send
        - protected_merge
        - over_budget
        - destructive_delete
        - privilege_escalation
      description: Authority whitelist only. change_path / create_file / propose_assignment MUST NOT be included.
    Pool:
      type: object
      additionalProperties: false
      required: [id, kind, secret_ref]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [cursor_account, bot_group, noop]
        secret_ref:
          $ref: "#/components/schemas/SecretRef"
    PoolPublic:
      type: object
      additionalProperties: false
      required: [id, kind, secret_ref, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
        secret_ref:
          type: string
          description: URI only (file: or env:). Resolved secret is never returned.
        created_at:
          type: string
      description: Pool listing may include secret_ref URI; never resolved plaintext.
    SecretRef:
      type: string
      description: |
        M0 allowed: `file:/abs/or/mounted/path` | `env:VAR_NAME`.
        Delayed: sops: / cloud KMS. API NEVER echoes resolved plaintext.
      pattern: "^(file:/|env:)[A-Za-z0-9._/:-]+$"
    JwtClaims:
      type: object
      required: [sub, role, pool_ids, iat, exp]
      properties:
        sub: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        pool_ids:
          type: array
          items: { type: string }
        iat: { type: integer }
        exp: { type: integer }
        tid: { type: string, description: optional tenant }
    FreezeSetRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        reason: { type: string }
    FreezeState:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          nullable: true
        updated_by:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
    AuditLogEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - at
        - actor_sub
        - actor_role
        - action
        - resource_type
        - resource_id
        - request_id
        - payload_json
      properties:
        id:
          type: string
        at:
          type: string
        actor_sub:
          type: string
        actor_role:
          $ref: "#/components/schemas/Role"
        action:
          type: string
        resource_type:
          type: string
          nullable: true
        resource_id:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
        payload_json:
          nullable: true
    CreateOfficeGoal:
      type: object
      additionalProperties: false
      required: [title, intent]
      properties:
        title:
          type: string
          description: Human name. Must not be used as a raw UUID label in the shell.
        intent:
          type: string
          description: One-sentence intent. Forbidden BriefV1 keys (steps, script, …) are rejected with 422.
    OfficeGoal:
      type: object
      required: [id, title, status_summary]
      properties:
        id:
          type: string
        title:
          type: string
          description: Human-readable label; UUID titles are replaced with 未命名目标.
        intent:
          type: string
          nullable: true
        status:
          type: string
        status_summary:
          type: string
    OfficeGoalList:
      type: object
      required: [goals, readonly]
      properties:
        goals:
          type: array
          items:
            $ref: "#/components/schemas/OfficeGoal"
        empty_copy:
          type: string
        readonly:
          type: boolean
    OfficeFillSlots:
      type: object
      required: [goal_id, title, slots, readonly]
      properties:
        goal_id:
          type: string
        title:
          type: string
        intent:
          type: string
          nullable: true
        readonly:
          type: boolean
        slots:
          type: array
          items:
            type: object
            required: [filled_by, stage, artifacts]
            properties:
              assignment_id:
                type: string
              filled_by:
                type: object
                properties:
                  name:
                    type: string
                  pool_kind:
                    type: string
                    nullable: true
                  role:
                    type: string
              stage:
                type: string
                enum: [proposed, accepted, filling, waiting_evidence, has_artifacts, done]
              stage_label:
                type: string
              artifacts:
                type: array
                items:
                  type: object
                  properties:
                    kind: { type: string }
                    uri: { type: string }
                    href: { type: string }
    DeskPresenceList:
      type: object
      required: [desks, readonly]
      properties:
        readonly:
          type: boolean
        hitl:
          type: string
        desks:
          type: array
          items:
            type: object
            required: [name, presence, status]
            properties:
              id: { type: string }
              name: { type: string }
              avatar: { type: string }
              presence:
                type: string
                enum: [busy, waiting_evidence, idle]
              status:
                type: string
    CreateGoal:
      type: object
      additionalProperties: false
      required: [title, mode, coordinator_ref]
      properties:
        title:
          type: string
        mode:
          type: string
          enum: [explore, deliver]
        coordinator_ref:
          type: string
        dispatch_policy:
          type: string
          enum: [coordinator_only, human_allowed]
          default: coordinator_only
        gate_template_id:
          type: string
          nullable: true
        safety_gate:
          type: boolean
        dial:
          $ref: "#/components/schemas/Dial"
    BriefV1:
      type: object
      additionalProperties: false
      required: [outcome, constraints, evidence_shape]
      properties:
        outcome:
          type: string
        constraints:
          type: array
          items:
            type: string
        evidence_shape:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceKind"
    FillAssignment:
      type: object
      additionalProperties: false
      required: [pool_id, brief]
      properties:
        pool_id:
          type: string
        brief:
          $ref: "#/components/schemas/BriefV1"
        budget:
          type: object
          additionalProperties: false
          properties:
            max_usd:
              type: number
            max_tokens:
              type: integer
            max_runs:
              type: integer
        exception_grant_id:
          type: string
    EvidenceKind:
      type: string
      enum: [pr, report_md, summary_md, screenshot, ci_check, artifact_uri]
    AttachEvidence:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, uri]
            properties:
              kind:
                $ref: "#/components/schemas/EvidenceKind"
              uri:
                type: string
              sha256:
                type: string
              shadow:
                type: boolean
    PolicyCheck:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/DialAuthorityAction"
        track:
          type: string
          enum: [authority_gate, advisory_hint]
        goal_id:
          type: string
        assignment_id:
          type: string
        context:
          type: object
          additionalProperties: true
    PolicyCheckResult:
      type: object
      required: [decision, track, reason_code, redirect]
      properties:
        decision:
          type: string
          enum: [allow, redirect_hint, require_gate, deny]
        track:
          type: string
          enum: [authority_gate, advisory_hint]
        reason_code:
          type: string
          description: authority_whitelist when action ∈ DialAuthorityAction
        redirect:
          type: object
          nullable: true
          properties:
            hint: { type: string }
            fail_count: { type: integer }
            threshold: { type: integer }
        action:
          type: string
        blocks:
          type: boolean
        creates_gate:
          type: boolean
    Run:
      type: object
      required: [id, adapter, dial_at_dispatch]
      properties:
        id:
          type: string
        assignment_id:
          type: string
        adapter:
          type: string
        external_agent_id:
          type: string
          nullable: true
        external_run_id:
          type: string
          nullable: true
        idempotency_key:
          type: string
        dial_at_dispatch:
          $ref: "#/components/schemas/Dial"
        status:
          type: string
        advisory:
          type: boolean
          description: get_run is advisory and MUST NOT drive Gate ready
    DecideGate:
      type: object
      required: [decision, version]
      properties:
        decision:
          type: string
          enum: [pass, revise, defer]
        version:
          type: integer
        note:
          type: string
        structural_change:
          type: boolean
          default: false
    ErrorBody:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum:
            - brief_forbidden_field
            - freeze_active
            - webhook_bad_signature
            - webhook_skew
            - pool_forbidden
            - secret_ref_unsupported
            - predicate_evidence_mismatch
            - optimistic_lock
            - mcp_entry_required
            - unauthenticated
            - office_write_forbidden
        message:
          type: string
        keys:
          type: array
          items: { type: string }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
