services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      HARNESS_MODE: all
      DATABASE_PATH: /app/data/harness.db
      PORT: "8080"
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_API_STUB: ${CURSOR_API_STUB:-}
    ports:
      - "8080:8080"
    volumes:
      - harness-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["pnpm", "--filter", "@harness/worker", "start"]
    environment:
      DATABASE_PATH: /app/data/harness.db
      WORKER_INTERVAL_MS: "500"
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    volumes:
      - harness-data:/app/data
    depends_on:
      - api
    profiles: ["split"]

volumes:
  harness-data:
