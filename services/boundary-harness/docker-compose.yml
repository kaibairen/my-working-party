services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      HARNESS_MODE: all
      DATABASE_PATH: /app/data/harness.db
      PORT: "8080"
      WEBHOOK_URL: ${WEBHOOK_URL:-${DOMAIN_EVENTS_URL:-http://127.0.0.1:8787/hooks/domain-events}}
      DOMAIN_EVENTS_URL: ${DOMAIN_EVENTS_URL:-http://127.0.0.1:8787/hooks/domain-events}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-${HARNESS_WEBHOOK_SECRET:-}}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_API_STUB: ${CURSOR_API_STUB:-}
      CURSOR_REPO_URL: ${CURSOR_REPO_URL:-${CURSOR_REPOSITORY:-https://github.com/kaibairen/my-working-party}}
      CURSOR_REPO_REF: ${CURSOR_REPO_REF:-${CURSOR_STARTING_REF:-main}}
    ports:
      - "8080:8080"
    volumes:
      - harness-data:/app/data
    healthcheck:
      # api_8080_bind_no_blip — treat listen-ready /health||/healthz only; not TCP-open.
      # Complementary to Backend H1 early-listen (bc-cb490333). CI then runs wait-api-healthy.sh.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["pnpm", "--filter", "@harness/worker", "start"]
    environment:
      DATABASE_PATH: /app/data/harness.db
      WORKER_INTERVAL_MS: "500"
      WEBHOOK_URL: ${WEBHOOK_URL:-${DOMAIN_EVENTS_URL:-http://127.0.0.1:8787/hooks/domain-events}}
      DOMAIN_EVENTS_URL: ${DOMAIN_EVENTS_URL:-http://127.0.0.1:8787/hooks/domain-events}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_API_STUB: ${CURSOR_API_STUB:-}
      CURSOR_REPO_URL: ${CURSOR_REPO_URL:-${CURSOR_REPOSITORY:-https://github.com/kaibairen/my-working-party}}
      CURSOR_REPO_REF: ${CURSOR_REPO_REF:-${CURSOR_STARTING_REF:-main}}
    volumes:
      - harness-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    profiles: ["split"]

volumes:
  harness-data:
