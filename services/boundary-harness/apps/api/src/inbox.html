<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>待办</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1419; --card:#1a222c; --line:#2b3643; --ok:#3dd68c; --warn:#f5c26b; --bad:#ff6b6b; --ink:#e8eef4; --muted:#93a1b1; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 ui-sans-serif, system-ui, "Noto Sans SC", "PingFang SC", sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 20px; }
    .sub { color: var(--muted); font-size: 13px; }
    .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
    main { padding: 24px; max-width: 980px; margin: 0 auto; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, button, textarea { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: #111820; color: var(--ink); padding: 8px 10px; }
    button { cursor: pointer; background: #243044; }
    button.ok { background: #163526; border-color: #245c3d; color: var(--ok); }
    button.warn { background: #3a2e14; border-color: #6b5420; color: var(--warn); }
    button.muted { background: #1a222c; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
    .missing { color: var(--warn); font-size: 13px; }
    .missing-list { margin: 8px 0 0; padding-left: 18px; }
    .missing-code { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
    .status { text-transform: uppercase; font-size: 12px; letter-spacing: .04em; }
    .ready { color: var(--ok); }
    .flash { margin: 12px 0; padding: 10px 12px; border-radius: 8px; background: #163526; color: var(--ok); display: none; }
    .flash.show { display: block; }
    .flash.conflict { background: #3a2e14; color: var(--warn); }
    a { color: #8cb4ff; }
    .title { font-size: 17px; }
    #dev-controls { display: none; }
    body.dev #dev-controls { display: flex; }
  </style>
</head>
<body>
  <!--
    Decision-maker vs ops/dev:
    Default / and /inbox = inbox-only (待办). No Health / OpenAPI / outbox / role-impersonation.
    Ops surfaces are only reachable via /ops (direct URL) or /inbox?dev=1 (shows role switch + 运维 link).
  -->
  <header data-testid="dm-topbar">
    <div>
      <h1>待办</h1>
      <div class="sub">需要你处理的事项。画布与花名册不是主路径。</div>
    </div>
    <div class="row">
      <div id="dev-controls" class="row" data-testid="dev-controls">
        <a href="/ops" data-testid="ops-link">运维</a>
        <select id="role" data-testid="role-impersonation">
          <option value="decision_maker">decision_maker</option>
          <option value="coordinator">coordinator</option>
        </select>
        <input id="actor" value="dm-1" />
      </div>
      <button id="reload" data-testid="reload-ready">刷新</button>
    </div>
  </header>
  <main data-testid="gate-inbox">
    <div id="flash" class="flash" data-testid="inbox-flash"></div>
    <p class="sub" id="hint">只显示已经可以裁决的事项。</p>
    <div id="list" data-testid="gate-list"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const DEV = new URLSearchParams(location.search).get("dev") === "1";
    if (DEV) document.body.classList.add("dev");
    const goalCache = new Map();
    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    const MISSING_ZH = {
      "evidence:summary_md": "缺少摘要",
      "evidence:artifact_uri": "缺少产物",
      "evidence:pr": "缺少 PR",
      "evidence:report_md": "缺少报告",
      "evidence:screenshot": "缺少截图",
      "evidence:ci_check": "缺少 CI 检查",
      "noop_or_offline_contract": "离线/空跑契约未满足",
      "run_lifecycle:FINISHED": "运行尚未结束",
      "policy_clearance:no_open_authority_escalation": "仍有未关闭的权限升级",
    };
    const ACTION_ZH = { destructive_delete: "破坏性删除" };
    const KIND_ZH = { deliver_ready_v1: "交付待审", safety_only_v1: "安全门待审" };
    const DECIDE_OK = { pass: "已通过", revise: "已打回重做", defer: "已稍后处理" };
    function currentRole() { return ($("role") && $("role").value) || "decision_maker"; }
    function currentActor() { return ($("actor") && $("actor").value) || "dm-1"; }
    const headers = () => ({
      "content-type": "application/json",
      authorization: `Bearer ${currentRole()}:${currentActor()}`,
      "x-harness-role": currentRole(),
      "x-harness-actor": currentActor(),
    });
    function flash(msg, kind) {
      $("flash").textContent = msg;
      $("flash").classList.add("show");
      $("flash").classList.toggle("conflict", kind === "conflict");
    }
    function relativeZh(iso) {
      if (!iso) return "";
      const t = Date.parse(iso);
      if (Number.isNaN(t)) return String(iso);
      const sec = Math.max(0, Math.round((Date.now() - t) / 1000));
      if (sec < 10) return "刚刚";
      if (sec < 60) return `${sec} 秒前`;
      const min = Math.round(sec / 60);
      if (min < 60) return `${min} 分钟前`;
      const hr = Math.round(min / 60);
      if (hr < 24) return `${hr} 小时前`;
      return `${Math.round(hr / 24)} 天前`;
    }
    function missingLabel(code) {
      const raw = String(code ?? "");
      if (MISSING_ZH[raw]) return `${MISSING_ZH[raw]}（${raw}）`;
      const auth = raw.match(/^authority_escalation:(.+)$/);
      if (auth) {
        const action = ACTION_ZH[auth[1]] || auth[1];
        return `需要批准权限升级：${action}（${raw}）`;
      }
      const ghPr = raw.match(/^github_pr:is_draft=(.+)$/);
      if (ghPr) return `GitHub PR 仍为草稿（${raw}）`;
      const ghCk = raw.match(/^github_checks:conclusion=(.+)$/);
      if (ghCk) return `GitHub 检查结论：${ghCk[1]}（${raw}）`;
      if (raw.startsWith("unknown_predicate:")) return `未知就绪条件（${raw}）`;
      if (raw.startsWith("unknown_predicate_node:")) return `未知条件节点（${raw}）`;
      if (raw.startsWith("evidence:")) return `缺少材料（${raw}）`;
      return raw;
    }
    function missingHtml(missing) {
      if (!missing.length) {
        return `<p class="missing" data-testid="missing-empty">材料齐全</p>`;
      }
      return `<div class="missing">还缺这些
        <ul class="missing-list">${missing.map((m) => {
          const label = missingLabel(m);
          return `<li data-testid="missing-item">${label}<span class="missing-code"> ${m}</span></li>`;
        }).join("")}</ul>
      </div>`;
    }
    function cardTitle(g, goalName) {
      const name = String(goalName || "").trim();
      if (name && !UUID_RE.test(name)) return name;
      const pred = g.predicate_id || (g.ready_result && g.ready_result.predicate_id) || "";
      return KIND_ZH[pred] || "待办事项";
    }
    async function loadGoalTitles(goalIds) {
      await Promise.all(goalIds.map(async (id) => {
        if (!id || goalCache.has(id)) return;
        try {
          const res = await fetch(`/v1/goals/${id}`, { headers: headers() });
          const body = await res.json();
          goalCache.set(id, body.title || "");
        } catch {
          goalCache.set(id, "");
        }
      }));
    }
    async function load() {
      const res = await fetch("/v1/gates?status=ready", { headers: headers() });
      const body = await res.json();
      const gates = (body.gates || []).filter((g) => g.status === "ready");
      await loadGoalTitles([...new Set(gates.map((g) => g.goal_id).filter(Boolean))]);
      $("list").innerHTML = gates.length ? gates.map((g) => {
        const missing = (g.ready_result && g.ready_result.missing) || [];
        const pred = g.predicate_id || (g.ready_result && g.ready_result.predicate_id) || "";
        const pver = g.predicate_version ?? (g.ready_result && g.ready_result.predicate_version) ?? "";
        const title = cardTitle(g, goalCache.get(g.goal_id));
        const rel = relativeZh(g.ready_at);
        return `<article class="card" data-testid="gate-card" data-id="${g.id}" data-version="${g.version}">
          <div class="row">
            <strong class="title" data-testid="gate-title">${title}</strong>
            <span class="status ready" data-testid="gate-status">${g.status}</span>
          </div>
          <p class="sub" data-testid="gate-id">${g.id}</p>
          <p class="sub" data-testid="predicate-id">predicate_id ${pred}</p>
          <p class="sub" data-testid="predicate-version">predicate_version ${pver}</p>
          <p class="sub" data-testid="ready-at"><span class="meta">ready_at</span> <time datetime="${g.ready_at || ""}">${rel}</time></p>
          ${missingHtml(missing)}
          <div class="row">
            <button class="ok" data-act="pass" data-testid="decide-pass">通过</button>
            <button class="warn" data-act="revise" data-testid="decide-revise">打回重做</button>
            <button class="muted" data-act="defer" data-testid="decide-defer">稍后处理</button>
          </div>
        </article>`;
      }).join("") : `<p class="sub" data-testid="inbox-empty">暂无待办</p>`;
    }
    $("list").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const card = btn.closest(".card");
      const id = card.dataset.id;
      const version = Number(card.dataset.version);
      const res = await fetch(`/v1/gates/${id}/decide`, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ decision: btn.dataset.act, version, structural_change: false }),
      });
      const body = await res.json();
      const code = (body && body.code) || (body.error && body.error.code);
      if (!res.ok) {
        if (res.status === 409 || code === "optimistic_lock") {
          flash("有人刚处理过，已刷新", "conflict");
          await load();
          return;
        }
        flash(`处理失败：${code || res.status}`);
        return;
      }
      flash(DECIDE_OK[btn.dataset.act] || "已处理");
      await load();
    });
    $("reload").onclick = load;
    load();
    try {
      const es = new EventSource("/v1/events?role=" + encodeURIComponent(currentRole()) + "&actor=" + encodeURIComponent(currentActor()));
      es.addEventListener("gate.ready", load);
    } catch (_) { /* SSE optional */ }
  </script>
</body>
</html>
