<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>待办</title>
  <style>
    :root { color-scheme: dark; --bg:#0c1014; --card:#161d26; --line:#243040; --ok:#3dd68c; --warn:#f5c26b; --ink:#e8eef4; --muted:#8b98a8; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 28px 24px 8px; max-width: 720px; margin: 0 auto; }
    h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
    main { padding: 8px 24px 48px; max-width: 720px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin: 16px 0; }
    .title { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    .meta { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
    .badge { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: #1d3a2c; color: var(--ok); margin-left: 8px; vertical-align: middle; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; align-items: center; }
    .chip { background: #3a2e14; color: var(--warn); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
    .chip-label { color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: #243044; color: var(--ink); padding: 9px 14px; cursor: pointer; }
    button.ok { background: #163526; border-color: #245c3d; color: var(--ok); }
    button.warn { background: #3a2e14; border-color: #6b5420; color: var(--warn); }
    button.muted { background: #1a222c; color: var(--muted); }
    .flash { margin: 12px 0; padding: 10px 12px; border-radius: 10px; background: #163526; color: var(--ok); display: none; }
    .flash.show { display: block; }
    .flash.conflict { background: #3a2e14; color: var(--warn); }
    .empty { color: var(--muted); font-size: 16px; padding: 32px 0; }
    details { margin-top: 12px; color: var(--muted); font-size: 13px; }
    .sr-only, [hidden] { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    #reload { display: none; }
  </style>
</head>
<body>
  <header>
    <h1 id="heading" data-testid="inbox-heading">待办</h1>
  </header>
  <main data-testid="gate-inbox">
    <div id="flash" class="flash" data-testid="inbox-flash"></div>
    <button id="reload" data-testid="reload-ready" tabindex="-1">刷新</button>
    <div id="list" data-testid="gate-list"></div>
  </main>
  <script>
    const ROLE = "decision_maker";
    const ACTOR = "dm-1";
    const PREDICATE_LABELS = {
      deliver_ready_v1: "验收标准：交付就绪",
      safety_only_v1: "验收标准：安全审批",
    };
    const MISSING_LABELS = {
      "authority_escalation:destructive_delete": "破坏性删除",
      "authority_escalation:external_send": "对外发送",
      "authority_escalation:protected_merge": "受保护合并",
      "authority_escalation:over_budget": "超预算",
      "authority_escalation:privilege_escalation": "提权",
      "run_lifecycle:FINISHED": "运行尚未结束",
      "evidence:summary_md": "摘要",
      "evidence:artifact_uri": "产物",
      "evidence:pr": "PR",
      "evidence:report_md": "报告",
    };
    const headers = () => ({
      "content-type": "application/json",
      authorization: `Bearer ${ROLE}:${ACTOR}`,
      "x-harness-role": ROLE,
      "x-harness-actor": ACTOR,
    });
    const $ = (id) => document.getElementById(id);
    function flash(msg, kind) {
      $("flash").textContent = msg;
      $("flash").classList.add("show");
      $("flash").classList.toggle("conflict", kind === "conflict");
    }
    function relativeTime(iso) {
      if (!iso) return "";
      const then = Date.parse(iso);
      if (!Number.isFinite(then)) return iso;
      const delta = Math.max(0, Date.now() - then);
      const min = Math.floor(delta / 60000);
      if (min < 1) return "刚刚";
      if (min < 60) return `${min} 分钟前`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr} 小时前`;
      return `${Math.floor(hr / 24)} 天前`;
    }
    function missingHtml(missing) {
      if (!missing.length) {
        return `<span class="sr-only" data-testid="missing-empty" hidden>missing[] empty</span>`;
      }
      return `<div class="chips" data-testid="missing-list">
        <span class="chip-label">还差：</span>
        ${missing.map((m) => {
          const label = MISSING_LABELS[m] || m;
          return `<span class="chip" data-testid="missing-item">${label}<span class="sr-only"> ${m}</span></span>`;
        }).join("")}
      </div>`;
    }
    function flashCopy(act) {
      if (act === "pass") return "已通过。";
      if (act === "revise") return "已打回重做。";
      if (act === "defer") return "已稍后处理。";
      return "已处理。";
    }
    async function load() {
      const res = await fetch("/v1/gates?status=ready", { headers: headers() });
      const body = await res.json();
      const gates = (body.gates || []).filter((g) => g.status === "ready");
      $("heading").textContent = "待办·" + gates.length;
      $("list").innerHTML = gates.length ? gates.map((g) => {
        const missing = (g.ready_result && g.ready_result.missing) || [];
        const pred = g.predicate_id || (g.ready_result && g.ready_result.predicate_id) || "";
        const pver = g.predicate_version ?? (g.ready_result && g.ready_result.predicate_version) ?? "";
        const title = g.goal_title || "需要你拍板";
        const predLabel = PREDICATE_LABELS[pred] || pred;
        return `<article class="card" data-testid="gate-card" data-id="${g.id}" data-version="${g.version}">
          <h2 class="title" data-testid="gate-title">${title}</h2>
          <p class="meta"><span class="badge" data-testid="gate-status" data-status="${g.status}">待你决定</span></p>
          <p class="meta" data-testid="predicate-label">${predLabel}</p>
          <p class="meta" data-testid="ready-at-label">${relativeTime(g.ready_at)}</p>
          ${missingHtml(missing)}
          <div class="row">
            <button class="ok" data-act="pass" data-testid="decide-pass">通过</button>
            <button class="warn" data-act="revise" data-testid="decide-revise">打回重做</button>
            <button class="muted" data-act="defer" data-testid="decide-defer">稍后处理</button>
          </div>
          <details>
            <summary>详情</summary>
            <p data-testid="gate-id">${g.id}</p>
            <p data-testid="predicate-id">predicate_id ${pred}</p>
            <p data-testid="predicate-version">predicate_version ${pver}</p>
            <p data-testid="ready-at">ready_at ${g.ready_at || ""}</p>
          </details>
        </article>`;
      }).join("") : `<p class="empty" data-testid="inbox-empty">现在没有需要你拍板的事。</p>`;
    }
    $("list").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const card = btn.closest(".card");
      const id = card.dataset.id;
      const version = Number(card.dataset.version);
      const res = await fetch(`/v1/gates/${id}/decide`, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ decision: btn.dataset.act, version, structural_change: false }),
      });
      const body = await res.json();
      const code = (body && body.code) || (body.error && body.error.code);
      if (!res.ok) {
        if (res.status === 409 || code === "optimistic_lock") {
          flash("这条已有人处理，已为你刷新", "conflict");
          await load();
          return;
        }
        flash("处理失败，请再试一次");
        return;
      }
      flash(flashCopy(btn.dataset.act));
      await load();
    });
    $("reload").onclick = load;
    load();
    try {
      const es = new EventSource("/v1/events?role=" + encodeURIComponent(ROLE) + "&actor=" + encodeURIComponent(ACTOR));
      es.addEventListener("gate.ready", load);
    } catch (_) { /* SSE optional */ }
  </script>
</body>
</html>
