name: harness-m0

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: services/boundary-harness

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/boundary-harness/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules
        run: pnpm rebuild better-sqlite3
      - name: Lint
        run: pnpm lint
      - name: ready-anti
        run: pnpm exec vitest run apps/api/tests/ready-anti
      - name: security-anti
        run: pnpm exec vitest run apps/api/tests/security-anti
      - name: Security acceptance contract
        run: pnpm exec vitest run apps/api/tests/contract
      - name: Unit + anti-pattern tests
        run: pnpm test
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (API + Inbox)
        run: pnpm test:e2e
        env:
          CI: "true"
